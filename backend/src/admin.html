<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Music Trivia</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-indigo-400 tracking-tight">Admin Panel</h1>
        <span class="text-xs text-gray-500 bg-gray-800 px-3 py-1 rounded">Music Trivia</span>
    </div>

    <div class="mb-4 flex gap-2 flex-wrap">
        <button onclick="fetchReports()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition">Refresh</button>
        <button onclick="bulkResolve()" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded-lg text-sm font-semibold transition">Bulk Resolve All</button>
        <span id="count-badge" class="text-sm text-gray-400 self-center"></span>
        <span id="progress" class="text-xs text-gray-500 self-center hidden">Working...</span>
    </div>

    <div id="reports" class="space-y-3"></div>
    <div id="empty" class="hidden text-gray-500 text-center py-16">
        <p class="text-lg">No reports</p>
        <p class="text-sm mt-1">Broken songs will appear here when players report them.</p>
    </div>
</div>

<script>
const SECRET = new URLSearchParams(location.search).get('secret');

async function api(path, opts = {}) {
    const url = '/api/admin' + path + (path.includes('?') ? '&' : '?') + 'secret=' + SECRET;
    const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...opts.headers },
        method: opts.method || 'GET',
        body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    return res.json();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function ytLink(id) {
    return id && id.length === 11
        ? '<a href="https://youtu.be/' + id + '" target="_blank" class="text-blue-400 underline text-xs">preview</a>'
        : '<span class="text-gray-600 text-xs">no yt id</span>';
}

async function fetchReports() {
    const data = await api('/reports');
    const container = document.getElementById('reports');
    const empty = document.getElementById('empty');
    const badge = document.getElementById('count-badge');

    if (!data.reports || data.reports.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        badge.textContent = '';
        return;
    }
    empty.classList.add('hidden');
    badge.textContent = data.reports.length + ' total';

    container.innerHTML = data.reports.map(r => {
        const yt = r.youtube_id;
        const ytHtml = ytLink(yt);
        return '<div class="bg-gray-800 rounded-lg p-4 border border-gray-700" data-report-id="' + r.id + '" data-song-id="' + r.song_id + '">' +
            '<div class="flex items-start justify-between gap-4">' +
                '<div class="flex-1 min-w-0">' +
                    '<div class="flex items-center gap-2 mb-1 flex-wrap">' +
                        '<span class="text-xs font-bold px-2 py-0.5 rounded ' + (r.reason === 'audio_failed' ? 'bg-red-900/50 text-red-300' : 'bg-yellow-900/50 text-yellow-300') + '">' + esc(r.reason) + '</span>' +
                        '<span class="text-xs text-gray-500">#' + r.song_id + '</span>' +
                        '<span class="text-xs text-gray-500">' + r.created_at + '</span>' +
                        (r.user_id ? '<span class="text-xs text-gray-600">user:' + r.user_id + '</span>' : '') +
                        '<span class="text-xs">' + ytHtml + '</span>' +
                    '</div>' +
                    '<p class="font-semibold text-gray-100 truncate">' + esc(r.title) + '</p>' +
                    '<p class="text-sm text-gray-400 truncate">' + esc(r.artist) + '</p>' +
                    (r.note ? '<p class="text-xs text-gray-500 mt-1 italic">' + esc(r.note) + '</p>' : '') +

                    '<div class="mt-2 flex gap-1.5">' +
                        '<input type="text" placeholder="youtube ID (11 chars)" class="yt-input bg-gray-700 text-gray-200 text-xs px-2 py-1 rounded w-44 border border-gray-600 focus:border-blue-500 focus:outline-none" maxlength="11">' +
                        '<button onclick="setYt(' + r.song_id + ', this)" class="px-2 py-1 text-xs bg-gray-600 hover:bg-gray-500 rounded transition">Set</button>' +
                    '</div>' +
                '</div>' +
                '<div class="flex flex-col gap-1.5 flex-shrink-0">' +
                    '<button onclick="resolveYt(' + r.song_id + ', this)" class="px-3 py-1.5 text-xs font-semibold bg-blue-600 hover:bg-blue-500 rounded transition whitespace-nowrap">Resolve YT</button>' +
                    '<button onclick="hideSong(' + r.song_id + ', ' + r.id + ', this)" class="px-3 py-1.5 text-xs font-semibold bg-red-800 hover:bg-red-700 rounded transition whitespace-nowrap">Hide</button>' +
                    '<button onclick="deleteSong(' + r.song_id + ', ' + r.id + ', this)" class="px-3 py-1.5 text-xs font-semibold bg-gray-700 hover:bg-red-900 rounded transition whitespace-nowrap">Delete</button>' +
                    '<button onclick="dismiss(' + r.id + ', this)" class="px-3 py-1.5 text-xs font-semibold bg-gray-700 hover:bg-gray-600 rounded transition whitespace-nowrap">Dismiss</button>' +
                '</div>' +
            '</div>' +
            '<div class="mt-2 hidden yt-result text-sm"></div>' +
        '</div>';
    }).join('');
}

async function resolveYt(songId, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    const data = await api('/songs/' + songId + '/resolve', { method: 'POST' });
    const card = btn.closest('[data-song-id]');
    const el = card.querySelector('.yt-result');
    el.classList.remove('hidden');
    if (data.youtube_id) {
        el.className = 'mt-2 text-sm text-green-400 yt-result';
        el.innerHTML = 'YouTube: <code class="text-green-300">' + data.youtube_id + '</code> <a href="https://youtu.be/' + data.youtube_id + '" target="_blank" class="underline text-blue-400">preview</a>';
        card.querySelector('.yt-input').value = data.youtube_id;
    } else {
        el.className = 'mt-2 text-sm text-red-400 yt-result';
        el.textContent = 'No YouTube ID found. Try a manual ID above.';
    }
    btn.textContent = 'Retry';
    btn.disabled = false;
}

async function setYt(songId, btn) {
    const card = btn.closest('[data-song-id]');
    const input = card.querySelector('.yt-input');
    const ytId = input.value.trim();
    if (!ytId || ytId.length !== 11) {
        input.focus();
        return;
    }
    btn.disabled = true;
    btn.textContent = '...';
    const data = await api('/songs/' + songId + '/youtube', { method: 'PUT', body: { youtube_id: ytId } });
    btn.textContent = 'Set';
    btn.disabled = false;
    if (data.updated) {
        input.className = input.className.replace('border-gray-600', 'border-green-500');
        setTimeout(function() { input.className = input.className.replace('border-green-500', 'border-gray-600'); }, 1500);
    }
}

async function hideSong(songId, reportId, btn) {
    if (!confirm('Hide this song from all quizzes? Report will also be dismissed.')) return;
    btn.disabled = true;
    btn.textContent = '...';
    await api('/songs/' + songId + '/hide', { method: 'POST' });
    await api('/reports/' + reportId + '/dismiss', { method: 'POST' });
    btn.closest('[data-song-id]').remove();
    updateBadge();
}

async function deleteSong(songId, reportId, btn) {
    if (!confirm('Delete song #' + songId + ' and all its data permanently?')) return;
    if (!confirm('This cannot be undone. Continue?')) return;
    btn.disabled = true;
    btn.textContent = '...';
    await api('/songs/' + songId, { method: 'DELETE' });
    btn.closest('[data-song-id]').remove();
    updateBadge();
}

function updateBadge() {
    const remaining = document.querySelectorAll('[data-song-id]').length;
    const badge = document.getElementById('count-badge');
    const empty = document.getElementById('empty');
    if (remaining) {
        badge.textContent = remaining + ' total';
    } else {
        badge.textContent = '';
        empty.classList.remove('hidden');
    }
}

async function dismiss(reportId, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    await api('/reports/' + reportId + '/dismiss', { method: 'POST' });
    btn.closest('[data-report-id="' + reportId + '"]').remove();
    updateBadge();
}

async function bulkResolve() {
    var btn = event.target;
    btn.disabled = true;
    var prog = document.getElementById('progress');
    prog.classList.remove('hidden');

    var cards = document.querySelectorAll('[data-song-id]');
    for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var songId = card.dataset.songId;
        prog.textContent = 'Resolving #' + songId + '...';
        var data = await api('/songs/' + songId + '/resolve', { method: 'POST' });
        var el = card.querySelector('.yt-result');
        el.classList.remove('hidden');
        if (data.youtube_id) {
            el.className = 'mt-2 text-sm text-green-400 yt-result';
            el.innerHTML = 'YouTube: <code class="text-green-300">' + data.youtube_id + '</code>';
            card.querySelector('.yt-input').value = data.youtube_id;
        } else {
            el.className = 'mt-2 text-sm text-red-400 yt-result';
            el.textContent = 'Not found';
        }
    }

    prog.classList.add('hidden');
    prog.textContent = 'Done!';
    btn.disabled = false;
}

fetchReports();
</script>
</body>
</html>
