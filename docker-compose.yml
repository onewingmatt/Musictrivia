services:
  musictrivia:
    build: .
    container_name: musictrivia
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_PATH: /data/database.sqlite
      FRONTEND_DIST: /app/frontend/dist
      JWT_SECRET: ${JWT_SECRET:-fallback_secret_key_for_dev}
      ADMIN_SECRET: ${ADMIN_SECRET:-musictrivia-admin-2026}
      # Set DISCORD_TOKEN in .env to enable the Discord bot
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      YT_PROXY: ${YT_PROXY-}
      GUILD_ID: ${GUILD_ID-}
    volumes:
      - musictrivia-data:/data
    ports:
      - "3001:3001"

  # Optional: PO token provider for YouTube on VPS IPs.
  # Only needed when YouTube blocks audio downloads from datacenter IPs.
  # Remove this service if running locally or on a residential connection.
  bgutil-pot:
    image: ghcr.io/jim60105/bgutil-pot:latest
    container_name: bgutil-pot
    restart: unless-stopped

volumes:
  musictrivia-data:
